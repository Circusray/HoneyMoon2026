<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>蜜月旅行紀錄 (Honeymoon Log)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body { font-family: 'Noto Sans TC', sans-serif; background-color: #f3f4f6; }
        .theme-iceland { background-color: #e0f2fe; border-left: 4px solid #0ea5e9; } 
        .theme-netherlands { background-color: #ffedd5; border-left: 4px solid #f97316; } 
        .theme-maldives { background-color: #ccfbf1; border-left: 4px solid #14b8a6; } 
        .theme-transit { background-color: #f3f4f6; border-left: 4px solid #6b7280; } 
        /* 收折動畫 */
        .rotate-icon { transition: transform 0.3s ease; }
        .collapsed .rotate-icon { transform: rotate(-90deg); }
    </style>
</head>
<body class="pb-20">

    <div id="app" class="max-w-md mx-auto min-h-screen bg-white shadow-xl relative">
        
        <header class="bg-indigo-600 text-white p-6 sticky top-0 z-20 shadow-md">
            <div class="flex justify-between items-center">
                <div>
                    <h1 class="text-2xl font-bold">🍯 蜜月旅行紀錄 Honeymoon</h1>
                    <p class="text-indigo-200 text-sm">3/14 - 4/4 (21 Days)</p>
                </div>
                <div class="space-x-2">
                    <button @click="exportData" class="text-white hover:text-indigo-200" title="匯出資料"><i class="fa-solid fa-download"></i></button>
                    <button @click="triggerImport" class="text-white hover:text-indigo-200" title="匯入資料"><i class="fa-solid fa-upload"></i></button>
                    <input type="file" id="importFile" @change="importData" class="hidden">
                </div>
            </div>
        </header>

        <div class="p-4 space-y-4">
            <div v-if="events.length === 0" class="text-center text-gray-400 py-10">
                <i class="fa-solid fa-plane-departure text-4xl mb-2"></i>
                <p>還沒有行程，按右下角新增！</p>
            </div>

            <div v-for="(dayEvents, dateKey) in groupedEvents" :key="dateKey" class="transition-all">
                
                <div @click="toggleDay(dateKey)" 
                     class="flex items-center mb-2 sticky top-24 z-10 bg-white/95 backdrop-blur py-3 px-3 rounded-lg shadow-sm cursor-pointer select-none hover:bg-gray-50 border border-gray-100"
                     :class="{ 'collapsed': collapsedDays[dateKey] }">
                    
                    <i class="fa-solid fa-chevron-down text-gray-400 mr-3 text-sm rotate-icon"></i>
                    
                    <div class="font-bold text-gray-800 text-lg mr-3">{{ formatDate(dateKey) }}</div>
                    
                    <div class="flex flex-wrap gap-1">
                        <span v-for="c in getUniqueCountries(dayEvents)" :key="c"
                              :class="getCountryBadgeClass(c)" 
                              class="text-xs px-2 py-1 rounded text-white font-bold shadow-sm">
                            {{ getCountryName(c) }}
                        </span>
                    </div>
                </div>

                <div v-show="!collapsedDays[dateKey]" class="space-y-3 pl-2 border-l-2 border-gray-100 ml-4">
                    <div v-for="event in dayEvents" :key="event.id" 
                         class="p-3 rounded-lg shadow-sm flex items-start relative group transition-all hover:shadow-md bg-white"
                         :class="getThemeClass(event.country)">
                        
                        <div class="flex flex-col items-center mr-4 min-w-[50px]">
                            <span class="text-xs font-bold text-gray-500">{{ formatTime(event.date) }}</span>
                            <div class="mt-1 w-8 h-8 rounded-full flex items-center justify-center bg-white/80 text-gray-600 shadow-sm">
                                <i :class="getTypeIcon(event.type)"></i>
                            </div>
                        </div>

                        <div class="flex-1 pr-8">
                            <h3 class="font-bold text-gray-800 text-lg leading-tight">{{ event.title }}</h3>
                            <p class="text-sm text-gray-600 mt-1 flex items-center">
                                <i class="fa-solid fa-location-dot mr-1 text-gray-400"></i> {{ event.location }}
                            </p>
                            
                            <a v-if="event.mapUrl" :href="event.mapUrl" target="_blank" 
                               class="inline-block mt-2 text-xs bg-white text-blue-600 border border-blue-200 px-2 py-1 rounded hover:bg-blue-50">
                                <i class="fa-solid fa-map"></i> 開啟地圖
                            </a>
                        </div>

                        <div class="absolute top-2 right-2 flex space-x-2">
                            <button @click.stop="openEditModal(event)" class="text-gray-400 hover:text-blue-500 p-1">
                                <i class="fa-solid fa-pen"></i>
                            </button>
                            <button @click.stop="deleteEvent(event.id)" class="text-gray-400 hover:text-red-500 p-1">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
            
            <div class="h-20"></div>
        </div>

        <button @click="openAddModal" 
                class="fixed bottom-6 right-6 bg-indigo-600 hover:bg-indigo-700 text-white w-14 h-14 rounded-full shadow-lg flex items-center justify-center text-2xl transition-transform hover:scale-110 z-20">
            <i class="fa-solid fa-plus"></i>
        </button>

        <div v-if="showModal" class="fixed inset-0 bg-black/50 z-50 flex items-end sm:items-center justify-center p-4 backdrop-blur-sm">
            <div class="bg-white w-full max-w-sm rounded-xl shadow-2xl overflow-hidden animate-slide-up">
                <div class="bg-gray-100 p-4 flex justify-between items-center border-b">
                    <h3 class="font-bold text-lg">{{ isEditing ? '編輯行程' : '新增行程' }}</h3>
                    <button @click="showModal = false" class="text-gray-500 hover:text-gray-800"><i class="fa-solid fa-xmark text-xl"></i></button>
                </div>
                
                <div class="p-6 space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-700">名稱</label>
                        <input v-model="newEvent.title" type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border focus:ring-indigo-500 focus:border-indigo-500">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">日期</label>
                            <input v-model="newEvent.dateOnly" @change="autoSetCountry" type="date" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">時間</label>
                            <input v-model="newEvent.timeOnly" type="time" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                        </div>
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">地點</label>
                        <input v-model="newEvent.location" type="text" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                    </div>

                    <div>
                        <label class="block text-sm font-medium text-gray-700">Google Maps & 相關連結</label>
                        <input v-model="newEvent.mapUrl" type="url" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                    </div>

                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700">類型</label>
                            <select v-model="newEvent.type" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                                <option value="flight">✈️ 飛行</option>
                                <option value="hotel">🏨 住宿</option>
                                <option value="spot">📍 景點</option>
                                <option value="food">🍽️ 美食</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700">國家區域</label>
                            <select v-model="newEvent.country" class="mt-1 block w-full rounded-md border-gray-300 shadow-sm p-2 border">
                                <option value="transit">移動/轉機</option>
                                <option value="iceland">冰島</option>
                                <option value="netherlands">荷蘭</option>
                                <option value="maldives">馬爾地夫</option>
                            </select>
                        </div>
                    </div>

                    <button @click="saveEvent" :disabled="!newEvent.title" class="w-full bg-indigo-600 text-white py-3 rounded-lg font-bold hover:bg-indigo-700 disabled:bg-gray-400 mt-2">
                        {{ isEditing ? '儲存變更' : '加入行程' }}
                    </button>
                </div>
            </div>
        </div>

    </div>

    <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, set, onValue, push, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
    import { createApp } from "https://unpkg.com/vue@3/dist/vue.esm-browser.js";

    // 使用您提供的 Key
    const firebaseConfig = {
        apiKey: "AIzaSyCjE2_CoEeaP0IlEq-dhRRzde4LVzYq8dA",
        authDomain: "honeymoon2026-d29be.firebaseapp.com",
        databaseURL: "https://honeymoon2026-d29be-default-rtdb.firebaseio.com",
        projectId: "honeymoon2026-d29be",
        storageBucket: "honeymoon2026-d29be.firebasestorage.app",
        messagingSenderId: "610186130333",
        appId: "1:610186130333:web:4f1879bc689b63a805f574",
        measurementId: "G-3F72F5GVJK"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const dbRef = ref(db, 'honeymoon_trips');

    createApp({
        data() {
            return {
                showModal: false,
                isEditing: false, 
                editingId: null,  
                events: [],
                collapsedDays: {}, // 🔴 新增：用來紀錄哪些天是被收折的
                newEvent: {
                    title: '',
                    dateOnly: '2026-03-14',
                    timeOnly: '12:00',
                    location: '',
                    mapUrl: '',
                    type: 'spot',
                    country: 'transit'
                }
            }
        },
        computed: {
            groupedEvents() {
                const groups = {};
                const sorted = [...this.events].sort((a, b) => new Date(a.date) - new Date(b.date));
                sorted.forEach(event => {
                    const dateKey = event.date.split('T')[0];
                    if (!groups[dateKey]) groups[dateKey] = [];
                    groups[dateKey].push(event);
                });
                return groups;
            }
        },
        mounted() {
            onValue(dbRef, (snapshot) => {
                const data = snapshot.val();
                if (data) {
                    this.events = Object.values(data);
                } else {
                    this.events = [];
                }
            });
        },
        methods: {
            // 🔴 新增：切換收折狀態
            toggleDay(dateKey) {
                this.collapsedDays[dateKey] = !this.collapsedDays[dateKey];
            },
            // 🔴 新增：取得當天所有的不重複國家，用於顯示多個標籤
            getUniqueCountries(events) {
                const countries = events.map(e => e.country);
                return [...new Set(countries)]; // 使用 Set 去除重複
            },
            autoSetCountry() {
                const date = new Date(this.newEvent.dateOnly);
                const month = date.getMonth() + 1;
                const day = date.getDate();
                if (month === 3) {
                    if (day >= 15 && day < 23) this.newEvent.country = 'iceland';
                    else if (day >= 23 && day < 30) this.newEvent.country = 'netherlands';
                    else if (day >= 30) this.newEvent.country = 'transit';
                    else this.newEvent.country = 'transit';
                } else if (month === 4) {
                    this.newEvent.country = 'maldives';
                }
            },
            openAddModal() {
                this.isEditing = false;
                this.editingId = null;
                this.newEvent = {
                    title: '',
                    dateOnly: '2026-03-14',
                    timeOnly: '12:00',
                    location: '',
                    mapUrl: '',
                    type: 'spot',
                    country: 'transit'
                };
                this.autoSetCountry();
                this.showModal = true;
            },
            openEditModal(event) {
                this.isEditing = true;
                this.editingId = event.id;
                const [datePart, timePart] = event.date.split('T');
                this.newEvent = {
                    title: event.title,
                    dateOnly: datePart,
                    timeOnly: timePart,
                    location: event.location,
                    mapUrl: event.mapUrl || '',
                    type: event.type,
                    country: event.country
                };
                this.showModal = true;
            },
            saveEvent() {
                if (!this.newEvent.title) return;
                const fullDate = `${this.newEvent.dateOnly}T${this.newEvent.timeOnly}`;
                const eventID = this.isEditing ? this.editingId : Date.now().toString(); 
                
                const eventData = {
                    id: eventID,
                    title: this.newEvent.title,
                    date: fullDate,
                    location: this.newEvent.location,
                    mapUrl: this.newEvent.mapUrl,
                    type: this.newEvent.type,
                    country: this.newEvent.country
                };
                set(ref(db, 'honeymoon_trips/' + eventID), eventData);
                this.showModal = false;
            },
            deleteEvent(id) {
                if(confirm('確定要刪除這個行程嗎？')) {
                    remove(ref(db, 'honeymoon_trips/' + id));
                }
            },
            getThemeClass(country) { return `theme-${country}`; },
            getCountryBadgeClass(country) {
                switch(country) {
                    case 'iceland': return 'bg-sky-500';
                    case 'netherlands': return 'bg-orange-500';
                    case 'maldives': return 'bg-teal-500';
                    default: return 'bg-gray-500';
                }
            },
            getCountryName(country) {
                const map = { iceland: '冰島', netherlands: '荷蘭', maldives: '馬爾地夫', transit: '移動/轉機' };
                return map[country] || country;
            },
            getTypeIcon(type) {
                const map = { flight: 'fa-plane', hotel: 'fa-bed', spot: 'fa-map-location-dot', food: 'fa-utensils' };
                return `fa-solid ${map[type]}`;
            },
            formatDate(dateStr) {
                const d = new Date(dateStr);
                const week = ['日','一','二','三','四','五','六'];
                return `${d.getMonth()+1}/${d.getDate()} (${week[d.getDay()]})`;
            },
            formatTime(isoStr) { return isoStr.split('T')[1]; },
            exportData() {
                const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(this.events));
                const downloadAnchorNode = document.createElement('a');
                downloadAnchorNode.setAttribute("href", dataStr);
                downloadAnchorNode.setAttribute("download", "honeymoon_backup.json");
                document.body.appendChild(downloadAnchorNode);
                downloadAnchorNode.click();
                downloadAnchorNode.remove();
            },
            triggerImport() { document.getElementById('importFile').click(); },
            importData(event) {
                const file = event.target.files[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = (e) => {
                    try {
                        const imported = JSON.parse(e.target.result);
                        if (confirm(`即將匯入 ${imported.length} 筆行程，這會覆蓋雲端資料，確定嗎？`)) {
                            imported.forEach(item => {
                                set(ref(db, 'honeymoon_trips/' + item.id), item);
                            });
                        }
                    } catch (err) { alert('檔案格式錯誤'); }
                };
                reader.readAsText(file);
            }
        }
    }).mount('#app');
    </script>
</body>
</html>
